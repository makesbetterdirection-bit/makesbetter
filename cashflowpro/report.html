:root{--panel:#0E1424;--line:#2A3450;--sub:#9AA6C2}
html,body{margin:0;background:#C9CDD4;font-family:'IBM Plex Sans KR',sans-serif;-webkit-text-size-adjust:100%}
.panel{background:var(--panel);color:#fff;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.panel .in{max-width:794px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.panel .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel .hd b{font-family:'Onest',sans-serif;font-weight:500;font-size:16px;letter-spacing:.04em}
.panel .hd span{font-size:13px;color:var(--sub)}
.panel details summary{cursor:pointer;font-size:14px;color:var(--sub);list-style:none}
.panel details summary::-webkit-details-marker{display:none}
.panel details[open] summary{margin-bottom:10px}
.panel textarea,.panel input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#141B2E;color:#fff;border-radius:10px;padding:10px 12px;font:14px 'IBM Plex Sans KR',sans-serif}
.panel textarea#json{min-height:64px;font:12px ui-monospace,Menlo,monospace}
.panel .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
.panel .btns{display:flex;gap:8px;flex-wrap:wrap}
.panel button{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:#18203A;color:#fff;font:500 14px 'IBM Plex Sans KR',sans-serif;cursor:pointer}
.panel button.pri{background:#1D4FBF;border-color:#1D4FBF}
.panel #msg{font-size:13px;color:var(--sub);min-height:18px}
@media (max-width:560px){.panel .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
#report{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 12px 60px}
.pw{position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.page{position:absolute;left:0;top:0;width:794px;height:1123px;overflow:hidden;background:#F3F3F3;transform-origin:0 0;-webkit-font-smoothing:antialiased}
.page *{box-sizing:border-box}
.t{position:absolute;margin:0;line-height:1.3;color:#111;word-break:keep-all;overflow-wrap:anywhere}
.r,.e{position:absolute}.e{border-radius:50%}
svg.abs{position:absolute;overflow:visible}
.sec{position:absolute;left:64px;width:662px;display:flex;align-items:center;gap:20px;line-height:1.3;white-space:nowrap}
.sec i{flex:1;height:1px;display:block}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .panel{display:none}
  #report{display:block;padding:0}
  .pw{box-shadow:none;width:210mm!important;height:297mm!important;page-break-after:always;break-after:page;overflow:hidden}
  .pw:last-child{page-break-after:auto;break-after:auto}
  .page{transform:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
