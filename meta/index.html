          '</div>' +
          '<div class="mb-iq-areas"><div class="t">무엇을 확인하나요</div><ul>' +
            '<li>투자 이해 — ETF·복리·환율 기초</li>' +
            '<li>투자 결정 — 목표 설정과 실행 습관</li>' +
            '<li>시장 이해 — 뉴스·트렌드를 읽는 감각</li>' +
            '<li>투자 심리 — 손실·급락장에서의 대응력</li>' +
            '<li>세금 이해 — ISA·IRP 등 절세 활용도</li>' +
          '</ul></div>' +
          '<div class="mb-iq-review"><div class="sub-main">지금까지 약 1,200명이 참여했어요</div></div>' +
          '<button class="mb-iq-btn" id="mb-iq-start-btn">금융 IQ 테스트 시작하기</button>' +
        '</div>' +
      '</div>' +

      '<div class="mb-iq-screen" id="mb-iq-s-quiz">' +
        '<div class="mb-iq-quiz-wrap">' +
          '<div class="mb-iq-progress-wrap" id="mb-iq-progress"></div>' +
          '<div class="mb-iq-qcount" id="mb-iq-qcount"></div>' +
          '<div class="mb-iq-qsection" id="mb-iq-qsection"></div>' +
          '<div class="mb-iq-qtext" id="mb-iq-qtext"></div>' +
          '<div id="mb-iq-opts"></div>' +
          '<div class="mb-iq-nav-row">' +
            '<button class="mb-iq-btn-ghost" id="mb-iq-prev">이전</button>' +
            '<button class="mb-iq-btn" id="mb-iq-next">다음</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="mb-iq-screen" id="mb-iq-s-contact">' +
        '<div class="mb-iq-form-wrap">' +
          '<div class="mb-iq-section-title mb-iq-serif">결과 리포트를 받아보세요</div>' +
          '<div class="mb-iq-section-desc">점수는 바로 확인하실 수 있고, 담당 디렉터가 결과를 바탕으로 1:1 코칭 리포트를 이어서 전달해 드려요.</div>' +
          '<div class="mb-iq-field"><label>본인 성함</label><input type="text" id="mb-iq-name" placeholder="홍길동"></div>' +
          '<div class="mb-iq-field"><label>전화번호</label><input type="tel" id="mb-iq-phone" placeholder="010-0000-0000"></div>' +
          '<div class="mb-iq-field"'+(FIXED?' style="display:none"':'')+'><label>담당 디렉터</label>' +
            '<select id="mb-iq-director">' +
              '<option value="">선택해주세요</option>' +
              PICK.map(function(d){ return '<option'+(FIXED&&FIXED.k===d.k?' selected':'')+'>'+d.label+'</option>'; }).join('') +
            '</select>' +
          '</div>' +
          '<button class="mb-iq-btn" id="mb-iq-submit">내 점수 확인하기</button>' +
          '<div class="mb-iq-privacy">제출하신 정보와 점수는 담당 디렉터에게 전달되어 상담 및 리포트 작성 목적으로만 사용됩니다.</div>' +
        '</div>' +
      '</div>' +

      '<div class="mb-iq-screen" id="mb-iq-s-result">' +
        '<div class="mb-iq-result-wrap">' +
          '<div class="mb-iq-r-eyebrow">테스트 완료</div>' +
          '<div class="mb-iq-r-h2 mb-iq-serif">나의 금융 IQ 점수</div>' +
          '<div class="mb-iq-r-who" id="mb-iq-r-who"></div>' +
          '<div class="mb-iq-score-card">' +
            '<div class="num-main" id="mb-iq-r-score">0</div>' +
            '<div class="num-sub">/ 100</div>' +
            '<div class="mb-iq-tier-name" id="mb-iq-r-tier"></div>' +
            '<div class="mb-iq-bar-track"><div class="mb-iq-bar-fill" id="mb-iq-r-bar"></div></div>' +
            '<div class="mb-iq-legend"><span>0</span><span>30</span><span>45</span><span>65</span><span>85</span><span>100</span></div>' +
          '</div>' +
          '<div class="mb-iq-next-note">점수 확인, 여기까지가 셀프 체크예요. 자세한 진단과 코칭 방향이 담긴 리포트는 <b id="mb-iq-r-director"></b>님이 확인 후 개인화해서 곧 전달해 드려요.</div>' +
        '</div>' +
        '<div class="mb-iq-footer"><div class="mb-iq-f-logo">MAKESBETTER</div><div class="mb-iq-f-line mb-iq-serif">Better Financial, Better Life</div></div>' +
      '</div>';

    if (window.emailjs && EMAILJS_PUBLIC_KEY){
      try { emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); } catch(e){}
    }

    function showScreen(id){
      root.querySelectorAll('.mb-iq-screen').forEach(function(s){ s.classList.remove('mb-iq-active'); });
      root.querySelector('#'+id).classList.add('mb-iq-active');
      root.scrollIntoView({behavior:'smooth', block:'start'});
    }

    // ---- 인트로 → 퀴즈 ----
    root.querySelector('#mb-iq-start-btn').addEventListener('click', function(){
      current = 0;
      renderQuestion();
      showScreen('mb-iq-s-quiz');
    });

    // ---- 퀴즈 렌더링 ----
    function renderProgress(){
      var bars = '';
      for (var i=0;i<QUESTIONS.length;i++){ bars += '<i class="'+(i<=current?'on':'')+'"></i>'; }
      root.querySelector('#mb-iq-progress').innerHTML = bars;
    }
    function renderQuestion(){
      var q = QUESTIONS[current];
      root.querySelector('#mb-iq-qcount').textContent = (current+1) + ' / ' + QUESTIONS.length;
      root.querySelector('#mb-iq-qsection').textContent = q.section;
      root.querySelector('#mb-iq-qtext').textContent = q.text;
      var optsHtml = '';
      OPTIONS.forEach(function(label, idx){
        var sel = answers[current] === idx ? ' mb-iq-sel' : '';
        optsHtml += '<button class="mb-iq-opt'+sel+'" data-idx="'+idx+'">'+label+'</button>';
      });
      root.querySelector('#mb-iq-opts').innerHTML = optsHtml;
      root.querySelectorAll('.mb-iq-opt').forEach(function(btn){
        btn.addEventListener('click', function(){
          answers[current] = parseInt(btn.getAttribute('data-idx'),10);
          renderQuestion();
        });
      });
      root.querySelector('#mb-iq-prev').style.visibility = current===0 ? 'hidden' : 'visible';
      root.querySelector('#mb-iq-next').textContent = current===QUESTIONS.length-1 ? '결과 보기' : '다음';
      renderProgress();
    }
    root.querySelector('#mb-iq-prev').addEventListener('click', function(){
      if (current>0){ current--; renderQuestion(); }
    });
    root.querySelector('#mb-iq-next').addEventListener('click', function(){
      if (answers[current] === null){
        alert('답변을 선택해주세요.');
        return;
      }
      if (current < QUESTIONS.length-1){
        current++;
        renderQuestion();
      } else {
        showScreen('mb-iq-s-contact');
      }
    });

    // ---- 연락처 → 결과 + 이메일 발송 ----
    var submitBtn = root.querySelector('#mb-iq-submit');
    submitBtn.addEventListener('click', function(){
      var name = root.querySelector('#mb-iq-name').value.trim();
      var phone = root.querySelector('#mb-iq-phone').value.trim();
      var director = root.querySelector('#mb-iq-director').value;
      if (!name || !phone || !director){
        alert('성함, 전화번호, 담당 디렉터를 모두 입력해주세요.');
        return;
      }
      var raw = answers.reduce(function(sum, a){ return sum + (a||0); }, 0);
      var score100 = Math.round((raw/40)*100);
      var tier = getTierName(score100);

      submitBtn.disabled = true;
      submitBtn.textContent = '전송 중...';

      function showResult(){
        root.querySelector('#mb-iq-r-who').textContent = name + '님';
        root.querySelector('#mb-iq-r-score').textContent = score100;
        root.querySelector('#mb-iq-r-tier').textContent = tier;
        root.querySelector('#mb-iq-r-director').textContent = director;
        showScreen('mb-iq-s-result');
        setTimeout(function(){
          var bar = root.querySelector('#mb-iq-r-bar');
          if (bar) bar.style.width = score100 + '%';
        }, 100);
      }

      if (window.emailjs && EMAILJS_PUBLIC_KEY){
        var answerDetail = buildAnswerDetail();
        mbIqBuildReport(name, score100, tier, director).then(null, function(e){ console.warn('리포트 PDF 생성 실패:', e); return ''; }).then(function(reportPdf){ var mbParams = {
          report_pdf: reportPdf,
          report_name: mbIqReportFileName(name, tier),
          title: name + '님 ' + score100 + '점 (' + tier + ')',
      site_label: " · 금융 아이큐",
      
          to_email: MAILTEST ? 'makesbetter.direction@gmail.com' : (DIRECTOR_EMAILS[director] || NOTIFY_EMAIL),
          name: name,
          phone: phone,
          director: director,
          score: score100,
          tier: tier,
          answers: answerDetail
        };
        /* 공용 알림 양식: 제목 {{subject}} · 본문 {{{body}}} */
        var he = function(t){ return String(t==null?'':t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
        var nd = new Date(), z = function(n){ return (n<10?'0':'')+n; }, ymd = nd.getFullYear()+'-'+z(nd.getMonth()+1)+'-'+z(nd.getDate());
        mbParams.subject = (MAILTEST ? '[발송 시험] ' : '') + '금융 IQ.' + name + ' 님.' + ymd;
        var iqHead = [['고객이름', name], ['전화번호', phone || '-'], ['담당자', director], ['날짜', ymd + ' ' + z(nd.getHours()) + ':' + z(nd.getMinutes())], ['점수', score100 + '점 · ' + tier]]
          .map(function(r){ return he(r[0]) + ': ' + he(r[1]); }).join('<br>');
        var WR = '<div style="font-family:system-ui,-apple-system,Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif;font-size:15px;line-height:1.8;color:#111">';
        mbParams.body = WR + iqHead + (reportPdf ? '<br><br>금융 IQ 리포트(PDF)를 첨부했습니다.' : '') + '<br><br>' + he(answerDetail).replace(/\n/g, '<br>') + '</div>';
        mbParams.body_plain = WR + iqHead + '<br><br>※ PDF 리포트 첨부에 실패해 본문만 보냅니다.<br><br>' + he(answerDetail).replace(/\n/g, '<br>') + '</div>';
        /* 공용 알림(PDF 첨부) 양식은 참조(Cc)가 없어서 회사 메일을 받는 사람에 함께 넣는다 */
        if (!MAILTEST && mbParams.to_email.indexOf('makesbetter.direction@gmail.com') < 0) mbParams.to_email += ',makesbetter.direction@gmail.com';
        if (TEST) { window.__metaParams = mbParams; return Promise.resolve(); }
        return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, mbParams).then(null, function(err){
          console.warn('PDF 첨부 발송 실패, 첨부 없이 재발송:', err);
          var p2 = {};
          for (var k in mbParams) p2[k] = mbParams[k];
          p2.report_pdf = '';
          p2.answers = mbParams.answers + '\n\n※ PDF 리포트 첨부에 실패해 본문만 발송되었습니다.';
          p2.body = mbParams.body_plain;
          return emailjs.send(EMAILJS_SERVICE_ID, 'template_o2bn4wc', p2);
        });
        }).then(showResult, function(err){
          console.warn('이메일 발송 실패 (진행은 계속됩니다):', err);
          showResult();
        });
      } else {
        showResult();
      }
    });
  }

  document.querySelectorAll('[id="mb-iq-root"]').forEach(initMbIq);
})();


</script>
</body>
</html>
