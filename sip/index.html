      if(dir>0){
        if(k==="director"&&!S.director)return err("디렉터를 골라 주세요.");
        if(k==="sip"&&!S.sip)return err("커피를 골라 주세요.");
        if(k==="name"){if(!S.name)return err("성함을 적어 주세요.");if(S.phone.replace(/\D/g,"").length<10)return err("휴대폰 번호를 정확히 적어 주세요.")}
        if(k==="worry"&&!S.worry)return err("하나를 골라 주세요.");
        if(k==="income"&&!S.incomeType)return err("하나를 골라 주세요.");
        if(k==="need"&&!S.needInfo)return err("YES 또는 NO를 골라 주세요.");
        if(k==="review")return send();
      }
      S.q+=dir;draw()}
    root.querySelector("#cq-next").onclick=function(){go(1)};
    var bk=root.querySelector("#cq-back");if(bk)bk.onclick=function(){go(-1)};
    [].forEach.call(root.querySelectorAll(".cq-opts"),function(g){g.addEventListener("click",function(e){var b=e.target.closest(".cq-o");if(!b)return;var set=g.getAttribute("data-set"),v=b.getAttribute("data-v");
      if(g.getAttribute("data-multi")){var i=S[set].indexOf(v);if(i>-1)S[set].splice(i,1);else S[set].push(v);b.classList.toggle("on")}
      else{S[set]=v;[].forEach.call(g.querySelectorAll(".cq-o"),function(x){x.classList.toggle("on",x===b)});setTimeout(function(){go(1)},220)}})});
    var ph=root.querySelector("#s-phone");if(ph)ph.addEventListener("input",function(){var d=ph.value.replace(/\D/g,"").slice(0,11);ph.value=d.length>7?d.replace(/(\d{3})(\d{3,4})(\d{4})/,"$1-$2-$3"):d.length>3?d.slice(0,3)+"-"+d.slice(3):d});
    [].forEach.call(root.querySelectorAll("input"),function(i){i.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();var all=[].slice.call(root.querySelectorAll("input")),ix=all.indexOf(i);if(ix<all.length-1)all[ix+1].focus();else go(1)}})});
  }
  function qa(q,a){return "Q. "+q+"\nA. "+(a&&a.length?a:"-")}
  function memo(){return [" 축하드립니다. "+S.director+" 디렉터님",(S.name||"고객")+"님이 상담을 신청하셨습니다.","","이름 : "+(S.name||"-"),"연락처 : "+(S.phone||"-"),"추천인 : "+(S.referrer||"-"),"",
    qa("The Opening Sip",S.sip),"",qa("담당 디렉터 성함",S.director),"",qa("가장 불편한 재정적 고민",S.worry),"",qa("현재 주된 자산운용 방법",S.assetMethod.join(", ")),"",qa("현재 자산운용의 목적",S.assetGoal.join(", ")),"",
    qa("희망하는 추가 소득 형태",S.incomeType),"",qa("보유 계좌 점검",S.accounts.join(", ")),"",qa("필수 금융 정보 & 상식 필요",S.needInfo),"","유입: 디렉터 페이지 (calc.makesbetter.co.kr/sip)"].join("\n")}
  function done(fail){document.body.classList.remove("cf-hero");
    root.innerHTML='<main class="cq-body sd"><div class="sd-cup" aria-hidden="true">'+(S.sip.indexOf("ICE")===0?"🧊":"☕")+'</div><h2 class="cq-h">'+(fail?'전송이 잠깐 막혔어요':'신청이 접수됐어요')+'</h2>'+
      '<p class="cq-p">'+(fail?'신청 내용은 이 화면에 남아 있어요. 아래 버튼으로 다시 보내 주세요.':esc(S.director)+' 디렉터가 '+esc(S.sip)+'를 준비하고 연락드릴게요.<br>마지막으로 카카오톡 채널을 추가하면 접수가 완료됩니다.')+'</p></main>'+
      '<div class="cq-foot">'+(fail?'<button class="cq-next" id="sd-retry">다시 보내기</button>':'<a class="cq-next kk" href="'+CONFIG.channelUrl+'">카카오톡 채널 추가하고 완료하기</a>')+'</div>';
    if(fail)root.querySelector("#sd-retry").onclick=send;
    else{try{fetch("https://abacus.jasoncameron.dev/hit/mbkr.my/sip-apply",{keepalive:true,mode:"no-cors"})}catch(e){}}}
  function send(){var b=root.querySelector("#cq-next")||root.querySelector("#sd-retry");if(b){b.disabled=true;b.textContent="보내는 중…"}
    var dEmail=(CONFIG.directors.filter(function(x){return x.name===S.director})[0]||{}).email;
    var params={site_label:" · 금융 코칭 등록",consult_type:"The Opening Sip 신청",date:today(),time:"-",name:S.name,phone:S.phone,email:"-",memo:memo(),director:S.director,to_email:(dEmail?dEmail+",":"")+CONFIG.monitorEmail};
    if(!window.emailjs)return done(true);
    emailjs.send(CONFIG.emailjsServiceId,CONFIG.emailjsTemplateId,params).then(function(){done(false)}).catch(function(e){console.error(e);done(true)})}
  draw();
})();
</script>
</body>
</html>
