<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>초대 이벤트 실시간 순위</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="초대 이벤트 실시간 순위">
<meta property="og:description" content="지금 몇 명이 함께했는지 실시간으로 확인하세요.">
<meta property="og:image" content="https://calc.makesbetter.co.kr/go/og.jpg?v=5">
<meta name="theme-color" content="#15171C">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/go/go.css">
<style>
body{background:#15171C;color:#fff}
.top span{color:var(--gold2);font-weight:800;letter-spacing:.2em;display:flex;align-items:center;gap:6px}
.top span:before{content:"";width:7px;height:7px;border-radius:50%;background:#E5484D;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.kick{color:var(--gold2)}
.big{margin-top:12px;font-size:34px;line-height:1.28;font-weight:800;letter-spacing:-.035em}
.st{display:flex;margin-top:30px;padding-bottom:22px;border-bottom:1px solid #2C2F36}
.st div{flex:1}.st div:nth-child(2){text-align:center}.st div:last-child{text-align:right}
.st b{display:block;font-size:24px;font-weight:800}
.st span{font-size:12px;color:#8E8A80}
.rk{list-style:none}
.rk li{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid #2C2F36}
.rk .n{flex:0 0 22px;font-size:18px;font-weight:800;color:#6E6A62}
.rk li.t .n{color:var(--gold2)}
.rk .nm{flex:1;font-size:18px;font-weight:700}
.rk .nm small{display:block;font-size:12px;font-weight:600;color:var(--gold2)}
.rk .c{font-size:18px;font-weight:800}
.empty{padding:30px 0;color:#8E8A80;font-size:14px;text-align:center}
.foot{margin-top:18px;font-size:12px;color:#8E8A80;line-height:1.6}
.btn.wh{background:#fff;color:#15171C}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>MAKESBETTER</b><span>LIVE</span></div>
  <div class="kick" id="dd">BETTER QUIZ · ROUND 2</div>
  <div class="big">지금까지<br><span id="tot">0</span>명이 함께했어요</div>
  <div class="st">
    <div><b id="cf">0명</b><span>커피 달성</span></div>
    <div><b id="th">10 / 10</b><span>3만원 남은 자리</span></div>
    <div><b id="td">0명</b><span>오늘 등록</span></div>
  </div>
  <ul class="rk" id="rk"><li class="empty">첫 등록을 기다리고 있어요.</li></ul>
  <p class="foot">이름은 가운데 글자를 가려서 보여요. 같은 번호의 중복 등록, 본인 번호, 퀴즈 참여자 번호는 인원에서 빠져요. 같은 인원이면 먼저 도달한 분이 위예요. <span id="upd"></span></p>
  <a class="btn wh" href="/go/me/">내 기록 확인하기</a>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var PR={1:'일본 여행 50만원',2:'조 말론 향수 또는 30만원'};
  function load(){fetch('/api/go/board').then(function(x){return x.json()}).then(function(d){
    $('tot').textContent=d.total.toLocaleString('ko-KR');
    $('cf').textContent=d.coffee+'명';$('th').textContent=(d.threeLimit-d.threeGiven)+' / '+d.threeLimit;$('td').textContent=d.today+'명';
    if(d.end){var left=Math.ceil((Date.parse(d.end)-Date.now())/864e5),e=new Date(d.end);$('dd').textContent=(left>0?'D-'+left:left===0?'D-DAY':'마감')+' · '+(e.getMonth()+1)+'.'+e.getDate()+' 마감'}
    $('rk').innerHTML=d.top.length?d.top.map(function(x){return '<li class="'+(x.rank<=2?'t':'')+'"><span class="n">'+x.rank+'</span><span class="nm">'+esc(x.name)+(PR[x.rank]?'<small>'+PR[x.rank]+'</small>':'')+'</span><span class="c">'+x.count+'명</span></li>'}).join(''):'<li class="empty">첫 등록을 기다리고 있어요.</li>';
    var n=new Date();$('upd').textContent='· '+('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+' 갱신';
  }).catch(function(){})}
  load();setInterval(function(){if(!document.hidden)load()},20000);
})();
</script>
</body>
</html>
