<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>플랫폼 유입 현황 | MAKESBETTER</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
body{margin:0;background:#0A0A0B;color:#F4F4F2;font-family:"Pretendard Variable",system-ui,sans-serif;letter-spacing:-.02em}
main{max-width:560px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:26px;font-weight:800;letter-spacing:-.04em}h1 i{color:#D11010;font-style:normal}
p{margin-top:10px;font-size:14px;line-height:1.7;color:#A0A0A3}
table{width:100%;margin-top:28px;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:14px 6px;border-bottom:1px solid rgba(255,255,255,.14);text-align:right;font-size:16px}
th{font-size:12.5px;font-weight:600;color:#A0A0A3;border-bottom-color:#F4F4F2}
th:first-child,td:first-child{text-align:left}
td:first-child b{display:block;font-weight:700}td:first-child small{font-size:12.5px;color:#A0A0A3}
td.k{font-weight:800}
tfoot td{font-weight:800;border-bottom:0;border-top:1px solid #F4F4F2}
</style></head><body><main>
<h1>플랫폼 유입 현황<i>.</i></h1>
<p>플래너별 주소로 들어온 수입니다. 방문은 페이지를 연 횟수, 채널 추가는 버튼을 누른 횟수, 등록은 채널 추가 후 페이지로 돌아와 잠금이 열린 횟수입니다. 같은 사람이 여러 번 열면 방문은 여러 번 세어집니다. 카카오톡은 누가 추가했는지 알려 주지 않아 이름은 알 수 없습니다.</p>
<table><thead><tr><th>플래너</th><th>방문</th><th>채널 추가</th><th>등록</th></tr></thead><tbody id="tb"></tbody><tfoot><tr><td>합계</td><td id="t0">0</td><td id="t1">0</td><td id="t2">0</td></tr></tfoot></table>
<p id="at"></p>
</main><script>
(function(){
  var P=[['lee','이종호'],['oh','오수현'],['byun','변보라'],['hong','홍민아'],['kang','강소리'],['kimdh','김다희'],['kimsy','김상윤'],['','공통 주소 (/open)']];
  var tb=document.getElementById('tb'),T=[0,0,0];
  function get(k){return fetch('https://abacus.jasoncameron.dev/get/mbkr.my/'+k).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){return j.value||0}).catch(function(){return 0})}
  P.forEach(function(p){var tag=p[0]?'open-'+p[0]:'open',tr=document.createElement('tr');
    tr.innerHTML='<td><b></b><small></small></td><td>·</td><td>·</td><td class="k">·</td>';tr.querySelector('b').textContent=p[1];tr.querySelector('small').textContent=p[0]?'/p/'+p[0]:'';tb.appendChild(tr);
    [tag,tag+'-channel',tag+'-done'].forEach(function(k,i){get(k).then(function(v){tr.children[i+1].textContent=v.toLocaleString('ko-KR');T[i]+=v;document.getElementById('t'+i).textContent=T[i].toLocaleString('ko-KR')})})});
  document.getElementById('at').textContent=new Date().toLocaleString('ko-KR')+' 기준';
})();
</script></body></html>
