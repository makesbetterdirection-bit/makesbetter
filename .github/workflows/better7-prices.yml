name: Better.7 ETF prices auto-update

# 평일 정기 3회 (KST 07:50 / 12:50 / 15:50) + 보조 3회 (08:20 / 13:20 / 16:20).
# GitHub cron 은 UTC 기준이며 지연되거나 건너뛰어질 수 있어 보조 실행을 둔다.
# 값이 직전과 같으면 파일을 건드리지 않으므로 중복 실행은 안전하다.
on:
  schedule:
    - cron: "50 22 * * 0-4"   # 07:50 KST (Mon–Fri) — 직전 거래일 종가
    - cron: "20 23 * * 0-4"   # 08:20 KST (Mon–Fri) — 보조: 직전 거래일 종가
    - cron: "50 3 * * 1-5"    # 12:50 KST (Mon–Fri) — 당일 장중 현재가
    - cron: "20 4 * * 1-5"    # 13:20 KST (Mon–Fri) — 보조: 당일 장중 현재가
    - cron: "50 6 * * 1-5"    # 15:50 KST (Mon–Fri) — 당일 종가
    - cron: "20 7 * * 1-5"    # 16:20 KST (Mon–Fri) — 보조: 당일 종가
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: better7-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch prices and rebuild better7_prices.json
        id: upd
        run: |
          set -o pipefail
          python3 scripts/update_better7_prices.py | tee -a "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.upd.outputs.changed == 'true'
        run: |
          git config user.name "better7-bot"
          git config user.email "actions@users.noreply.github.com"
          git add better7_prices.json
          MODE="${{ steps.upd.outputs.mode }}"
          if [ "$MODE" = "intraday" ]; then LABEL="intraday"; else LABEL="closing price"; fi
          PENDING="${{ steps.upd.outputs.pending }}"
          MSG="Update Better.7 ETF prices — ${{ steps.upd.outputs.date }} ${LABEL}"
          if [ "$PENDING" != "none" ]; then MSG="$MSG (pending: $PENDING)"; fi
          git commit -m "$MSG"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        run: |
          echo "changed=${{ steps.upd.outputs.changed }} mode=${{ steps.upd.outputs.mode }} date=${{ steps.upd.outputs.date }} pending=${{ steps.upd.outputs.pending }}" >> "$GITHUB_STEP_SUMMARY"
          cat better7_prices.json >> "$GITHUB_STEP_SUMMARY"
