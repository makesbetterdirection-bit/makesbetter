<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAKESBETTER 컨설팅 사용법</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="메이크스베러 컨설팅 사용법 · 디렉터용">
<meta property="og:type" content="website">
<meta property="og:title" content="MAKESBETTER 컨설팅 사용법">
<meta property="og:description" content="Better Consulting Guide · 디렉터용">
<link rel="icon" href="/studio/icon-32.png">
<link rel="apple-touch-icon" href="/studio/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Studio 계열: 연회색 바탕, 흰 카드, 검정 글자, 좁은 한 줄 칼럼. 영문 큰 제목은 굵기 혼합. 색은 주황 점 하나만(고객에게 보내는 링크). */
:root{
  --bg:#F2F2F2; --card:#FFFFFF; --ink:#000000; --sub:#8A8A8A; --line:#EBEBEB; --chip:#F4F4F4; --dot:#FF5A1F;
  --display:"Inter Tight","Noto Sans KR",system-ui,sans-serif;
  --text:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111111;--card:#1B1B1B;--ink:#F2F2F2;--sub:#8F8F8F;--line:#2A2A2A;--chip:#242424;--dot:#FF7A45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111111;--card:#1B1B1B;--ink:#F2F2F2;--sub:#8F8F8F;--line:#2A2A2A;--chip:#242424;--dot:#FF7A45;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;letter-spacing:-.02em;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit}
button{font:inherit;color:inherit}
.col{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .col{display:flex;align-items:center;gap:10px;padding-block:16px}
header b{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em}
header span{font-size:14px;color:var(--sub)}
#prog{position:absolute;left:0;bottom:-1px;height:1px;width:0;background:var(--ink)}

.hero{padding-block:96px 72px}
.hero h1{margin:0;font-family:var(--display);font-size:clamp(56px,15vw,88px);line-height:.95;letter-spacing:-.055em;font-weight:300}
.hero h1 b{font-weight:700;letter-spacing:-.035em}
.hero h1 u{text-decoration-thickness:2px;text-underline-offset:8px}
.hero p{margin:28px 0 0;font-size:19px;font-weight:500}

h2{margin:0 0 16px;font-size:24px;font-weight:700;letter-spacing:-.04em}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:56px}
.pick button{background:var(--card);border:1.5px solid transparent;border-radius:16px;padding:18px 18px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pick button small{font-size:13px;color:var(--sub)}
.pick button strong{font-size:20px;font-weight:700;letter-spacing:-.04em;line-height:1.3}
.pick button[aria-pressed="true"]{border-color:var(--ink)}
.pick button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.course{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.course[hidden]{display:none}
.card{background:var(--card);border-radius:16px;padding:18px 18px 8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top small{display:block;font-size:13px;color:var(--sub)}
.top strong{display:block;font-size:19px;font-weight:700;letter-spacing:-.04em;line-height:1.35}
.n{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:15px}
.big{display:flex;align-items:baseline;gap:8px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.big b{font-family:var(--display);font-weight:300;font-size:48px;line-height:1;letter-spacing:-.05em}
.big span{font-size:15px;color:var(--sub)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:17px}
li:last-child{border-bottom:0}
li a{flex:none;text-decoration:none;font-size:14px;color:var(--sub);background:var(--chip);border-radius:99px;padding:5px 12px;white-space:nowrap}
li a:hover,li a:focus-visible{color:var(--ink);outline:none}
li a.send::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dot);margin-right:6px;vertical-align:2px}
li em{flex:none;font-style:normal;font-size:14px;color:var(--sub)}
.gap{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;padding:6px 4px}
.gap::before{content:"";width:1px;height:22px;background:var(--sub);margin-left:12px}

.legend{display:flex;gap:16px;font-size:13px;color:var(--sub);padding:8px 2px 0}
.legend span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);margin-right:6px;vertical-align:2px}
.legend span.s::before{background:var(--dot)}
footer{padding-block:24px 72px;font-size:13px;color:var(--sub);border-top:1px solid var(--line);margin-top:24px}
.sub{display:flex;gap:6px;background:var(--card);border-radius:99px;padding:5px;margin:-36px 0 28px}
.sub[hidden]{display:none}
.sub button{flex:1;border:0;background:none;border-radius:99px;padding:10px 12px;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer}
.sub button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sub button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.talk{padding-bottom:40px}
.talk[hidden]{display:none}
.tprog{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.tbar{height:2px;background:var(--line);margin-bottom:14px}
.tbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap}
.chips button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.chips button.done{color:var(--ink)}
.chips button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.step{display:flex;flex-direction:column;gap:10px}
.step > small{font-size:13px;color:var(--sub)}
.step > h3{margin:0;font-size:26px;font-weight:700;letter-spacing:-.05em;line-height:1.3}
.step > p.lead{margin:0 0 6px;color:var(--sub);font-size:16px}
.blk{background:var(--card);border-radius:16px;padding:18px}
.blk > b{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-bottom:10px}
.say p{margin:0 0 12px;font-size:17px;line-height:1.75}
.say p:last-child{margin-bottom:0}
.say em{font-style:normal;font-size:14px;color:var(--sub)}
.say strong{font-weight:700}
.ask{border:1.5px solid var(--ink)}
.ask p{margin:0;font-size:18px;font-weight:700;line-height:1.55}
.proof{background:var(--chip)}
.proof p{margin:0;font-size:16px;line-height:1.65}
.chk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.chk li{font-size:15px;line-height:1.55;padding-left:18px;position:relative}
.chk li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--sub)}
.risk{border:1px solid var(--dot)}
.risk p{margin:0;font-size:15px;line-height:1.65}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl th{font-size:13px;color:var(--sub);font-weight:500}
.tbl td.r{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.nums2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nums2 div{background:var(--card);border-radius:16px;padding:16px}
.nums2 small{display:block;font-size:13px;color:var(--sub)}
.nums2 strong{display:block;font-family:var(--display);font-size:30px;font-weight:300;letter-spacing:-.04em;line-height:1.2;margin:4px 0}
.nums2 span{font-size:13px;color:var(--sub)}
.tnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.tnav button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer}
.tnav button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tnav button:disabled{opacity:.35;cursor:default}
.tnav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.basis{font-size:13px;color:var(--sub);margin:4px 2px 0}
@media (prefers-reduced-motion:reduce){.tbar i{transition:none}}
</style>
</head>
<body>
<header><div class="col"><b>MAKESBETTER</b><span id="hdr">컨설팅 사용법</span></div><i id="prog"></i></header>

<main class="col">
  <section class="hero">
    <h1><b>Better</b><br>Consulting<br><u>Guide</u></h1>
    <p>메이크스베러 컨설팅 사용법</p>
  </section>

  <h2>고객이 누구인가요</h2>
  <div class="pick" role="group" aria-label="과정 선택">
    <button id="bA" aria-pressed="true" data-c="A"><small>직접 아는 고객</small><strong>기계약자 · 지인 과정</strong></button>
    <button id="bB" aria-pressed="false" data-c="B"><small>소개받은 고객</small><strong>소개자 과정</strong></button>
  </div>

  <div class="sub" id="subA" role="tablist" aria-label="기계약자 · 지인 과정 보기">
    <button role="tab" id="tProc" aria-selected="true" data-v="proc">과정 안내</button>
    <button role="tab" id="tTalk" aria-selected="false" data-v="talk">실전 화법</button>
  </div>
  <section class="course" id="A"></section>
  <section class="course" id="B" hidden></section>
  <section class="talk" id="talkSec" hidden aria-label="실전 화법 (기계약자 · 지인)">
    <div class="tprog"><span>관심 미팅 실전 화법</span><span id="tPct"></span></div>
    <div class="tbar"><i id="tFill"></i></div>
    <div class="chips" id="tChips"></div>
    <div id="tStep"></div>
    <p class="basis">숫자는 달러 계산기 기본값(월 100만 원 · 10년) 화면 기준 (2026.11.13 확인). 계산기 시세·환율이 바뀌면 화면 숫자를 그대로 읽을 것.</p>
    <div class="tnav"><button id="tPrev">이전</button><button class="go" id="tNext">다음</button></div>
  </section>

  <div class="legend"><span class="s">고객에게 보내는 링크</span></div>
  <footer>MAKESBETTER Consulting Guide · 링크는 누르면 새 창으로 열립니다.</footer>
</main>

<script>
// 디렉터별 개인 링크: /user/?d=oh 처럼 열면 그 디렉터의 주소(mbkr.my/oh)로 바뀜. 기본은 lee.
var DK=["lee","oh","byun","hong","kang","kimdh","kimsy"],dk="lee";
try{var q=(new URLSearchParams(location.search).get("d")||"").trim();if(DK.indexOf(q)>-1)dk=q}catch(e){}
const L={
  basic:["베이직","mbkr.my/cashflow",1],
  iq:["금융 IQ","mbkr.my/meta",1],
  pro:["프로","mbkr.my/cashflowpro",1],
  report:["월배당 리포트","mbkr.my/report",1],
  me:["개인 링크","mbkr.my/"+dk,1]
};
const C={
A:{name:"기계약자 · 지인 과정",steps:[
 {lb:"시작",t:"약속을 잡는다",big:"약속",items:[["고객과 관심 미팅 약속 잡기"]]},
 {lb:"관심 미팅",t:"니즈를 올린다",big:"관심",sub:"미팅",items:[["달러 계산기로 보여주기","화면으로만"],["플랫폼 보여주며 진행"],["플랫폼 유입 링크로 등록시키기"],["1차 PT 약속 잡기"],["실전 화법 보기","#talk"]]},
 {lb:"1차 PT",t:"1차 PT 자료로 진행한다",big:"1차",sub:"PT",items:[["1차 PT 자료로 진행"]]},
 {lb:"2차 진행 전",t:"진단 두 가지를 하게 한다",big:"준비",items:[["머니4스퀘어 베이직 작성",L.basic],["금융 IQ 진행",L.iq]]},
 {lb:"2차 PT",t:"진단을 함께 보고 재무목표를 확인한다",big:"2차",sub:"PT",items:[["머니4스퀘어 베이직 리뷰"],["금융 IQ 리포트 보기"],["재무목표 확인"],["원천징수영수증 요청"]]},
 {lb:"3차 PT",t:"합의하고 포트폴리오를 정한다",big:"3차",sub:"PT",items:[["머니4스퀘어 프로 리뷰",L.pro],["3agree 합의 (소득 · 지출 · 저축)"],["포트폴리오 진행"]]},
 {lb:"클로징 이후",t:"개인 링크를 주고 소개를 요청한다",big:"소개",items:[["개인화 링크 고객에게 전달",L.me],["소개 요청"]]},
 {lb:"클로징 후 2개월",t:"중간 피드백",big:"2",sub:"개월",items:[["중간 피드백 진행",L.report]]},
 {lb:"클로징 후 6개월",t:"정규 피드백",big:"6",sub:"개월",items:[["정규 피드백 진행",L.report]]}
]},
B:{name:"소개자 과정",steps:[
 {lb:"시작",t:"개인 링크로 들어와 진단까지 한다",big:"유입",items:[["개인 링크로 플랫폼 유입",L.me],["설문 작성"],["머니4스퀘어 베이직 작성",L.basic],["금융 IQ 진행",L.iq]]},
 {lb:"1차 PT",t:"진단 결과를 함께 본다",big:"1차",sub:"PT",items:[["머니4스퀘어 베이직 리뷰"],["금융 IQ 결과 리뷰"],["원천징수영수증 요청"]]},
 {lb:"2차 미팅 전",t:"프로와 재무목표를 준비한다",big:"준비",items:[["머니4스퀘어 프로 작성",L.pro],["재무목표 확인"]]},
 {lb:"2차 PT",t:"합의하고 계좌를 연다",big:"2차",sub:"PT",items:[["머니4스퀘어 프로 리뷰"],["3agree 합의 (소득 · 지출 · 저축)"],["계좌 개설 진행"]]},
 {lb:"3차 PT",t:"포트폴리오를 정한다",big:"3차",sub:"PT",items:[["포트폴리오 진행"]]},
 {lb:"클로징 이후",t:"개인 링크를 주고 소개를 요청한다",big:"소개",items:[["개인화 링크 고객에게 전달",L.me],["소개 요청"]]},
 {lb:"클로징 후 2개월",t:"중간 피드백",big:"2",sub:"개월",items:[["중간 피드백 진행",L.report]]},
 {lb:"클로징 후 6개월",t:"정규 피드백",big:"6",sub:"개월",items:[["정규 피드백 진행",L.report]]}
]}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
for(const k in C){
  document.getElementById(k).innerHTML=C[k].steps.map((s,i)=>`${i?'<div class="gap" aria-hidden="true"></div>':''}<article class="card">
  <div class="top"><div><small>${esc(s.lb)}</small><strong>${esc(s.t)}</strong></div><span class="n">${i+1}</span></div>
  <div class="big"><b>${esc(s.big)}</b>${s.sub?`<span>${esc(s.sub)}</span>`:""}</div>
  <ul>${s.items.map(([t,l])=>`<li><span>${esc(t)}</span>${Array.isArray(l)?`<a class="${l[2]?"send":""}" href="https://${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`:l&&l[0]==="#"?`<a href="${l}">화법 보기</a>`:l?`<em>${esc(l)}</em>`:""}</li>`).join("")}</ul></article>`).join("");
}
function show(k){
  for(const x of ["A","B"]){document.getElementById(x).hidden=x!==k;document.getElementById("b"+x).setAttribute("aria-pressed",x===k)}
  document.getElementById("hdr").textContent=C[k].name;
  document.getElementById("subA").hidden=k!=="A";if(k!=="A"){document.getElementById("talkSec").hidden=true}else if(typeof view==="function"){view("proc")}
  try{localStorage.setItem("mb-guide-course",k)}catch(e){}
}
document.querySelectorAll(".pick button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.c)));
let saved="A";try{saved=localStorage.getItem("mb-guide-course")||"A"}catch(e){}
show(saved==="B"?"B":"A");
const prog=document.getElementById("prog");
addEventListener("scroll",()=>{const h=document.documentElement;prog.style.width=(h.scrollTop/((h.scrollHeight-h.clientHeight)||1)*100)+"%"},{passive:true});

const TS=[{"k": "오프닝", "t": "관리의 범위를 넓히는 첫 대화", "lead": "기존 보험 관리를 인정하고, 다음 단계로 자산관리를 소개하는 단계.", "b": [["say", ["고객님, 오늘은 보험 이야기와는 조금 다른 말씀을 드리려고 합니다.", "금융관리는 크게 두 가지입니다. 예상 못 한 일이 생겼을 때 <strong>자산을 지키는 것</strong>, 그리고 앞으로의 삶을 위해 <strong>자산을 만들어 가는 것</strong>.", "지금까지는 제가 첫 번째를 함께 관리해 드렸죠. 이제는 두 번째까지 넓혀 보시자는 겁니다.", "오늘 뭔가를 결정하시는 자리는 아닙니다. 더 나은 방향이 있는지 같이 찾아보는 자리라고 생각하시면 됩니다.", "이 이야기를 먼저 들으신 분들이 \"이런 방법이 있는 줄 몰랐다\"는 말씀을 많이 하셨거든요.", "한 시간 정도만 집중해 주시면, 분명히 도움이 되실 겁니다."]], ["ask", "그런데 고객님, 보험 말고 따로 자산관리 받고 계신 곳이 있으세요?"], ["table", ["고객 답", "이어가는 말"], [["따로 없다", "그럼 오늘이 자산관리의 출발점이 되겠네요."], ["은행에서 한다", "은행에서는 어떤 부분을 봐 주시나요? 전체 자산을 연결해서 보고 계신지도 궁금합니다."], ["직접 투자한다", "직접 하시는군요. 수익 말고 자산 전체 균형도 점검하고 계십니까?"], ["관심은 있는데 잘 모른다", "그래서 오늘 준비했습니다. 다 알고 시작하는 게 아니라, 시작하면서 알아가시면 됩니다."]]], ["chk", ["오늘은 상품을 결정하는 자리가 아니라는 것을 먼저 밝히기", "실제 금액을 말할지는 고객이 정하도록 두기", "기존 보험 관리에 아쉬운 점이나 남은 질문이 있는지 확인"]]]}, {"k": "원화 적금.1", "t": "지금 방식 그대로 모으면", "lead": "계산기 탭: 고객 인터뷰 → 원화 적금.1", "b": [["say", ["고객님, 지금 한 달에 저축은 어느 정도 하고 계세요? 100만 원 정도요? 좋습니다. 그 금액으로 10년을 계산해 보겠습니다.", "10년이면 넣으시는 원금만 <strong>1억 2천만 원</strong>입니다. 적은 돈이 아니죠.", "지금처럼 은행 적금(연 3%)으로 모으시면 만기에 <strong>1억 3,535만 원</strong>을 받으십니다. 세금 떼고 이자가 1,535만 원이고요.", "나쁘지 않아 보이시죠? 그런데 여기 하나만 눌러 보겠습니다. <em>[「물가 반영」 클릭]</em>", "물가가 해마다 3.6%씩 오른다고 넣으면, 이 돈으로 실제 살 수 있는 건 지금 돈으로 <strong>9,448만 원</strong>어치입니다.", "1억 2천을 넣었는데, 실제 가치는 <strong>2,551만 원이 줄어든 겁니다.</strong> <em>(잠깐 멈추기)</em>"]], ["proof", "다른 분들도 이 화면에서 제일 많이 놀라십니다. 통장 숫자는 늘었는데 실제로는 줄었다는 걸 처음 보셨다고들 하시죠."], ["ask", "앞으로 몇 년 안에 목돈 들어갈 계획이 있으세요?"], ["chk", ["숫자는 세후 기준 (연 3% 단리, 이자소득세 15.4%)", "실제 상품 금리·세금·우대조건은 상품마다 다름. 계산 결과와 가입 조건을 구분해서 설명"]]]}, {"k": "원화 적금.2", "t": "금리를 올리면 해결될까", "lead": "금리만 올려서는 한계가 있다는 것을 보여주는 화면.", "b": [["say", ["고객님, 하나 여쭤보겠습니다. <strong>만약 제가 연 7.1% 금리를 주는 상품을 갖고 있다면, 선택하시겠습니까?</strong> <em>(고객 답을 듣고)</em>", "그렇죠, 대부분 그렇게 답하십니다. 같은 100만 원, 10년인데 연 7.1%로 바꾸면 만기에 <strong>1억 5,634만 원</strong>입니다. 이자만 3,634만 원, 3% 적금보다 2천만 원 넘게 늘어나죠.", "금리 하나 바꿨을 뿐인데 이만큼 차이가 납니다. 그래서     if(ty==="proof")return `<div class="blk proof"><b>다른 고객 이야기</b><p>${v}</p></div>`;
    if(ty==="chk")return `<div class="blk chk"><b>확인할 것</b><ul>${v.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
    if(ty==="risk")return `<div class="blk risk"><b>꼭 말해야 하는 위험</b><p>${v}</p></div>`;
    if(ty==="nums")return `<div class="nums2">${v.map(([a,b2,c])=>`<div><small>${a}</small><strong>${b2}</strong><span>${c}</span></div>`).join("")}</div>`;
    if(ty==="table")return `<div class="blk tbl"><table><thead><tr>${v.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${w.map(r=>`<tr>${r.map((c,i)=>`<td${i&&/[0-9]/.test(c)&&c.length<14?' class="r"':''}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    return "";};
  document.getElementById("tStep").innerHTML=`<article class="step"><small>${tCur+1} / ${TS.length} · ${s.k}</small><h3>${s.t}</h3><p class="lead">${s.lead}</p>${s.b.map(blk).join("")}</article>`;
  document.getElementById("tChips").innerHTML=TS.map((x,i)=>`<button class="${i===tCur?"on":i<tCur?"done":""}" data-t="${i}">${i+1}. ${x.k}</button>`).join("");
  const p=Math.round((tCur+1)/TS.length*100);
  document.getElementById("tPct").textContent=p+"%";document.getElementById("tFill").style.width=p+"%";
  document.getElementById("tPrev").disabled=tCur===0;
  document.getElementById("tNext").textContent=tCur===TS.length-1?"처음으로":"다음";
  const on=document.querySelector("#tChips .on");if(on)on.scrollIntoView({block:"nearest",inline:"center"});
  try{localStorage.setItem("mb-guide-talk",String(tCur))}catch(e){}
}
function tGo(i,scroll){tCur=Math.max(0,Math.min(TS.length-1,i));tRender();if(scroll){const el=document.getElementById("talkSec");window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-70,behavior:"smooth"})}}
document.getElementById("tChips").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b)tGo(+b.dataset.t,true)});
document.getElementById("tPrev").onclick=()=>tGo(tCur-1,true);
document.getElementById("tNext").onclick=()=>tGo(tCur===TS.length-1?0:tCur+1,true);
function view(v){
  const talk=v==="talk";
  document.getElementById("A").hidden=talk;document.getElementById("talkSec").hidden=!talk;
  document.getElementById("tProc").setAttribute("aria-selected",!talk);document.getElementById("tTalk").setAttribute("aria-selected",talk);
  document.getElementById("hdr").textContent=talk?"기계약자 · 지인 · 실전 화법":C.A.name;
}
document.querySelectorAll("#subA button").forEach(b=>b.addEventListener("click",()=>{view(b.dataset.v);if(b.dataset.v==="talk")history.replaceState(null,"","#talk");else history.replaceState(null,"",location.pathname+location.search)}));
try{const s=+localStorage.getItem("mb-guide-talk");if(s>=0&&s<TS.length)tCur=s}catch(e){}
tRender();
function fromHash(){if(location.hash==="#talk"){show("A");view("talk")}}
addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
